<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f7fa">
  <meta name="description" content="让ElBot感知一切">
  <title>ElBot</title>
  <link rel="icon" href="assets/elbot-logo.svg" type="image/svg+xml">
  <script>
    {
      let preference = "";
      try { preference = localStorage.getItem("elbot.theme") || ""; } catch {}
      if (preference !== "light" && preference !== "dark") preference = "";
      document.documentElement.dataset.themePreference = preference;
      document.documentElement.dataset.theme = preference || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    }
  </script>
  <link rel="stylesheet" href="app.css">
  <script defer src="vendor/marked.umd.js"></script>
  <script defer src="vendor/purify.min.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body class="notices-hidden">
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <linearGradient id="elbot-wordmark-ink" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color: var(--wordmark-start)"/>
        <stop offset="100%" style="stop-color: var(--wordmark-end)"/>
      </linearGradient>
    </defs>
    <symbol id="elbot-wordmark" viewBox="110 30 204 76">
      <text x="210" y="100" text-anchor="middle" font-family="Noto Sans Display, Segoe UI, Arial, sans-serif" font-size="86" font-weight="750" letter-spacing="-2" fill="url(#elbot-wordmark-ink)" stroke="none">ElBot</text>
    </symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M5 4h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 3v-3H3V6a2 2 0 0 1 2-2Z"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m9 3-1 3-3 1-2 3 2 2-1 3 2 3 3-1 3 2 3-2 3 1 2-3-1-3 2-2-2-3-3-1-1-3Z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M13 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10zM13 3v7h7M8 15h8M8 18h5"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M5 16v4h14v-4"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 13a9 9 0 0 1-10-10A9 9 0 1 0 21 13Z"/></symbol>
  </svg>

  <header class="app-header">
    <button id="session-toggle" class="icon-button" type="button" aria-label="打开会话列表" aria-expanded="false" aria-controls="session-panel"><svg><use href="#i-menu"/></svg></button>
    <a class="brand" href="#/chat" aria-label="ElBot 首页">
      <img class="brand-symbol" src="assets/elbot-logo.svg" alt="">
      <svg class="brand-wordmark" role="img" aria-label="ElBot"><use href="#elbot-wordmark"/></svg>
      <span class="brand-divider"></span><span class="brand-caption">让ElBot感知一切</span>
    </a>
    <nav class="page-navigation" aria-label="页面">
      <button class="navigation-button" data-page="chat" type="button" aria-label="聊天" title="聊天"><svg><use href="#i-chat"/></svg><span>聊天</span></button>
      <button class="navigation-button" data-page="logs" type="button" aria-label="日志" title="日志"><svg><use href="#i-file"/></svg><span>日志</span></button>
      <button class="navigation-button" data-page="settings" type="button" aria-label="设置" title="设置"><svg><use href="#i-settings"/></svg><span>设置</span></button>
    </nav>
    <div class="header-actions">
      <button id="connection-button" class="connection-button" type="button" aria-label="连接设置"><span id="connection-dot" class="status-dot"></span><span id="connection-label">未连接</span></button>
      <button id="theme-toggle" class="icon-button" type="button" aria-label="切换明暗主题"><svg><use href="#i-moon"/></svg></button>
      <button id="notice-toggle" class="icon-button" type="button" aria-label="显示或隐藏通知" aria-expanded="false" aria-controls="notice-panel"><svg><use href="#i-bell"/></svg><span id="notice-unread" class="unread-dot" hidden></span></button>
    </div>
  </header>

  <section id="chat-page" class="page-view" aria-label="聊天" hidden>
  <div id="workspace" class="workspace">
    <aside id="session-panel" class="session-panel" aria-label="会话列表">
      <button id="new-session" class="new-session" type="button" disabled><svg><use href="#i-plus"/></svg>新对话</button>
      <div class="session-heading"><h2>会话</h2><button id="session-search-toggle" class="icon-button" type="button" aria-label="搜索会话" aria-expanded="false" aria-controls="session-search-form"><svg><use href="#i-search"/></svg></button></div>
      <form id="session-search-form" class="session-search-form" hidden>
        <label class="visually-hidden" for="session-search">搜索会话</label>
        <input id="session-search" type="search" placeholder="搜索会话 ↵" autocomplete="off">
        <button class="icon-button" type="submit" aria-label="提交搜索"><svg><use href="#i-search"/></svg></button>
      </form>
      <div id="session-list" class="session-list" aria-live="polite"></div>
      <p id="session-feedback" class="session-feedback" role="status">连接后查看会话</p>
      <div class="session-pagination"><button id="session-prev" type="button" disabled>上一页</button><span id="session-page" title="当前页/总页数">—/—</span><button id="session-next" type="button" disabled>下一页</button></div>
    </aside>
    <main class="chat-panel">
      <div id="conversation-heading" class="conversation-heading">新对话</div>
      <div id="chat-scroll" class="chat-scroll">
        <div id="welcome" class="welcome">
          <div class="welcome-emblem"><img src="assets/elbot-logo.svg" alt="ElBot"></div>
          <h1>让<span>ElBot</span>感知一切</h1>
          <div class="welcome-footnote"><span></span> token 节约 · 事件驱动 · 丰富扩展 <span></span></div>
        </div>
        <button id="history-more" class="history-more" type="button" hidden>更早消息</button>
        <div id="messages" class="messages" role="log" aria-label="对话" aria-live="polite" aria-relevant="additions"></div>
      </div>
      <button id="scroll-bottom" class="scroll-bottom" type="button" hidden>最新消息 ↓</button>

      <div class="composer-area">
        <form id="composer-form" class="composer">
          <div id="draft-files" class="draft-files" aria-label="待发送附件" hidden></div>
          <label class="visually-hidden" for="message-input">消息</label>
          <textarea id="message-input" rows="2" placeholder="消息 · / 命令 · @ 工具 · # 附件" autocomplete="off" spellcheck="false" disabled></textarea>
          <div id="completion-menu" class="completion-menu" role="listbox" aria-label="补全候选" hidden></div>
          <div class="composer-toolbar">
            <div class="composer-tools">
              <button id="attach-button" class="icon-button" type="button" aria-label="添加附件" disabled><svg><use href="#i-plus"/></svg></button>
              <div class="model-control">
                <button id="model-button" class="model-button" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="model-popover" disabled><span class="model-orbit"></span><span id="model-label">读取模型…</span><svg><use href="#i-chevron"/></svg></button>
                <section id="model-popover" class="model-popover" role="dialog" aria-label="选择模型" hidden>
                  <div class="popover-heading"><span>选择模型</span></div>
                  <label class="model-search"><svg><use href="#i-search"/></svg><input id="model-search" type="search" placeholder="模型 / 提供方" autocomplete="off" aria-label="搜索模型"></label>
                  <div id="model-list" class="model-list" aria-live="polite"></div>
                  <p id="model-pending" class="popover-footnote">使用当前模式的模型</p>
                </section>
              </div>
            </div>
            <div class="runtime-bar" role="status" aria-live="polite">
              <div class="runtime-main"><span id="phase-dot" class="status-dot"></span><span id="phase-label">等待连接</span><span id="tool-label" class="tool-label"></span></div>
              <div class="runtime-metrics"><span id="elapsed"></span><span id="usage"></span></div>
            </div>
            <button id="stop-button" class="action-button stop-button" type="button" hidden>停止</button>
            <button id="send-button" class="send-button" type="submit" aria-label="发送消息" disabled><svg><use href="#i-arrow"/></svg></button>
          </div>
        </form>
        <input id="file-input" type="file" multiple hidden>
      </div>
      <div id="drop-overlay" class="drop-overlay" hidden><div><svg><use href="#i-plus"/></svg><strong>拖入文件</strong><span>添加到当前消息</span></div></div>
    </main>

  </div>
  </section>
  <section id="logs-page" class="page-view management-page" aria-label="日志" hidden></section>
  <section id="settings-page" class="page-view management-page" aria-label="设置" hidden></section>
    <aside id="notice-panel" class="notice-panel" inert aria-label="通知">
      <div class="notice-heading"><div><h2>通知 <span id="notice-count">0</span></h2></div><button id="clear-notices" class="icon-button" type="button" aria-label="清空通知"><svg><use href="#i-trash"/></svg></button></div>
      <div id="notice-scroll" class="notice-scroll"><div id="notice-empty" class="notice-empty"><span class="quiet-orbit"></span><p>暂无通知</p><span>运行提示</span></div><div id="notices" role="log" aria-live="polite" aria-label="运行通知"></div></div>
    </aside>
  <div id="notice-backdrop" class="notice-backdrop" hidden></div>
  <div id="session-backdrop" class="session-backdrop" hidden></div>

  <dialog id="login-dialog" class="login-dialog" aria-labelledby="login-title">
    <button id="login-close" class="icon-button dialog-close" type="button" aria-label="关闭连接设置"><svg><use href="#i-close"/></svg></button>
    <div class="login-brand"><img class="brand-symbol" src="assets/elbot-logo.svg" alt=""><svg class="brand-wordmark" role="img" aria-label="ElBot"><use href="#elbot-wordmark"/></svg></div>
    <h2 id="login-title">连接 ElBot</h2>
    <form id="login-form">
      <label for="client-id">Client ID</label><input id="client-id" name="client_id" autocomplete="off" placeholder="客户端标识" required>
      <label for="login-token">Token</label><input id="login-token" name="token" type="password" autocomplete="off" placeholder="访问凭据" required>
      <p id="login-error" class="login-error" role="alert" hidden></p>
      <button id="login-submit" class="primary-button" type="submit">连接 ElBot <span>↗</span></button>
    </form>
    <button id="disconnect-button" class="text-button" type="button" hidden>退出登录</button>
  </dialog>
  <noscript><div class="noscript">请启用 JavaScript 以连接 ElBot。</div></noscript>
</body>
</html>
